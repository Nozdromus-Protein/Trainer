name: licznik_treningu
version: 1.7.0+2
publish_to: 'none'
description: Rozbudowana aplikacja treningowa kompatybilna z backendem Licznika Kalorii.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  health: ^13.3.1
  http: ^1.2.2
  image_picker: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  video_player: ^2.11.1
  # Etap: Konto i synchronizacja (opcjonalne — aplikacja działa też lokalnie).
  # Firebase inicjalizowane jest z ochroną try/catch, więc brak konfiguracji
  # (google-services.json / firebase_options.dart) NIE psuje trybu lokalnego.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2
  file_picker: ^10.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/videos/
    - assets/trainer/body_model/front/
    - assets/trainer/body_model/front/masks/
    - assets/trainer/body_model/back/
    - assets/trainer/body_model/back/masks/
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
