name: licznik_treningu
version: 0.1.0+1
publish_to: 'none'
description: Rozbudowana aplikacja treningowa kompatybilna z backendem Licznika Kalorii.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  health: ^13.3.1
  http: ^1.2.2
  image_picker: ^1.2.2
  shared_preferences: ^2.3.2
  video_player: ^2.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/videos/
    - assets/trainer/body_model/front/
    - assets/trainer/body_model/front/masks/
    - assets/trainer/body_model/back/
    - assets/trainer/body_model/back/masks/
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
